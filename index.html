<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Studio Fourci</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* Taruh semua kode <style> bawaan Admin.html Kakak di sini */
        :root {
            --primary: #d4af37;
            --border-gold: rgba(212,175,55,0.3);
            /* ... Seterusnya sesuai style Admin.html Kakak ... */
        }
        body { font-family: 'Poppins', sans-serif; background: #000; color: #fff; margin: 0; padding: 15px; }
        /* Terapkan CSS responsive HP yang kemarin kita buat */
        @media (min-width: 769px) {
            #tabGudang .grid-gudang-split {
                display: grid !important;
                grid-template-columns: 1.6fr 1fr !important;
                flex-direction: row !important;
                gap: 20px;
            }
        }
    </style>
</head>
<body>

    <div id="tabGudang">
        </div>

    <script>
        // 🔗 PASTE LINK URL WEB APP GOOGLE APPS SCRIPT KAKAK DI SINI!
        const BASE_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwjKZkqppvAjHvc2anJryDbTWdfV2kYV2az4EoCybMLN8YmsuNvbr_T46VW3PDcELtZwg/exec";

        // Fungsi pembantu untuk mengirim permintaan data ke Google Sheets via Fetch API
        async function panggilGoogleScript(fungsiName, parameterArray = []) {
            try {
                let response = await fetch(BASE_WEB_APP_URL, {
                    method: "POST",
                    mode: "cors",
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify({ fungsi: fungsiName, args: parameterArray })
                });
                let hasil = await response.json();
                return hasil;
            } catch (error) {
                console.error("Gagal koneksi ke Google Cloud API: ", error);
                alert("Koneksi terputus, coba refresh halaman!");
            }
        }

        // CONTOH PENYESUAIAN FUNGSI AMBIL DATA BARANG (PADA FRONTEND GITHUB)
        async function muatKatalogBarangGudang() {
            // Menggantikan google.script.run dengan Fetch API
            let data = await panggilGoogleScript("getStokAdmin");
            if(!data) return;

            let tbody = document.getElementById("tabelBarangBody"); 
            tbody.innerHTML = "";
            let daftarKategoriUnik = new Set();

            data.forEach(row => {
                let nama = row[0]; let kategori = row[1]; let stok = Number(row[2]); let satuan = row[3];
                if(kategori) daftarKategoriUnik.add(kategori.trim());

                let tr = document.createElement("tr");
                tr.innerHTML = `<td><b>${nama}</b></td><td><span>${kategori}</span></td>...`; 
                tbody.appendChild(tr);
            });
            
            perbaruiPilihanDropdownKategori(daftarKategoriUnik);
            jalankanFilterGudangLive();
        }

        // Jalankan fungsi otomatis saat halaman github pertama kali dibuka
        window.onload = function() {
            muatKatalogBarangGudang();
        };
    </script>
</body>
</html>
